<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="100" fill="#1a237e"/>

  <!-- Casa (telhado + corpo) -->
  <!-- Telhado -->
  <polygon points="256,90 420,240 92,240" fill="#ffffff"/>
  <!-- Chaminé -->
  <rect x="310" y="130" width="44" height="70" fill="#ffffff"/>
  <!-- Corpo da casa -->
  <rect x="120" y="230" width="272" height="192" fill="#ffffff"/>

  <!-- R$ centralizado na casa -->
  <text x="256" y="378"
        font-family="Georgia, serif"
        font-size="148"
        font-weight="bold"
        fill="#ffd600"
        text-anchor="middle"
        dominant-baseline="auto">R$</text>
</svg>
